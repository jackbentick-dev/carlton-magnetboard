<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carlton">
  <title>Carlton Season Hub</title>
  <script>
    // Phones get the mobile layout; everything else gets the desktop board, which tablets
    // (and phones that pick "Desktop view") see scaled down from 1440px wide.
    // Override with ?view=mobile|desktop, or the in-app switch (localStorage 'carlton-view').
    (function () {
      var phone = Math.min(screen.width, screen.height) < 600, pref = null;
      try { pref = new URLSearchParams(location.search).get('view') || localStorage.getItem('carlton-view'); } catch (e) {}
      window.CARLTON_PHONE = phone;
      window.CARLTON_MOBILE = pref === 'mobile' || pref === 'desktop' ? pref === 'mobile' : phone;
      if (!window.CARLTON_MOBILE && Math.min(screen.width, screen.height) < 1100) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1440');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    /* Solid base colour: iPhones paint any area outside the page with it (white when unset) */
    html { background-color: #060d1a; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(1100px 700px at 78% -12%, rgba(30,64,175,0.30) 0%, rgba(30,64,175,0) 60%),
        radial-gradient(900px 620px at -8% 112%, rgba(13,148,136,0.10) 0%, rgba(13,148,136,0) 55%),
        linear-gradient(160deg, #04070d 0%, #0a1526 45%, #05090f 100%),
        #060d1a;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
      50% { box-shadow: 0 0 30px rgba(59,130,246,0.5); }
    }
    @keyframes float-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes magnet-settle {
      0% { opacity: 0; transform: scale(1.14); }
      55% { opacity: 1; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes sheet-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .magnet-enter { animation: magnet-settle 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
    html { -webkit-text-size-adjust: 100%; }
    html, body { overscroll-behavior: none; }
    button { font-family: 'Inter', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    select, input { -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
